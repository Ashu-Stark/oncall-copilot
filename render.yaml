# Render blueprint: Postgres + API (Docker) + static web app.  New + -> Blueprint -> pick this repo.
# After the first deploy: run  python -m backend.app.seed --demo-incidents  once from the API's Shell tab.
databases:
  - name: oncall-db
    plan: free
    databaseName: oncall
    user: oncall

services:
  - type: web
    name: oncall-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: oncall-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: ALERT_INGEST_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_PASSWORD
        sync: false   # set it in the dashboard; it is shown on the login page of the public demo
      - key: STEP_DELAY_MS
        value: "350"
      - key: CORS_ORIGINS
        value: https://oncall-web.onrender.com

  - type: web
    name: oncall-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://oncall-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
