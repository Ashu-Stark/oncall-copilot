name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install "numpy>=2.0" "scikit-learn>=1.5" "pytest>=8"
      - name: Unit tests (retrieval, checks, grounding gate; no HOI instance needed)
        run: python -m pytest -q tests
